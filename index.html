<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الشاعر محمد آل وافي</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Tajawal:wght@300;400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fafafa;--muted:#a7a6a6;--nav:#b6b5b5;--strip:#8b8a8a;--pill:#fff;--pill-ink:#050505;
--u:calc(100vh/1058);--uw:calc(100vw/1487);
--h:clamp(var(--u),calc(var(--u)*.65 + var(--uw)*.35),calc(var(--u)*1.16));
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@supports(height:100dvh){:root{--u:calc(100dvh/1058)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#050505;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Manrope','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
a{text-decoration:none;color:inherit}
.stage{position:relative;height:100%;width:100%;overflow:hidden;background:#050505}
.plate{position:absolute;inset:0}
.plate-video{position:absolute;left:50%;top:calc(1*var(--u));width:calc(1492*var(--u));height:calc(1054*var(--u));transform:translateX(calc(-50% - .5*var(--u))) scaleX(-1);object-fit:cover;pointer-events:none}
.plate::after{content:"";position:absolute;inset:0;background:
linear-gradient(to bottom,rgba(5,5,5,0) 78.8%,rgba(5,5,5,.23) 79.6%,rgba(5,5,5,.45) 81.4%,rgba(5,5,5,.75) 83.3%,rgba(5,5,5,.84) 85.2%,rgba(5,5,5,.888) 88%,rgba(5,5,5,.905) 91%,rgba(5,5,5,.96) 95%,#050505 100%),
linear-gradient(to right,#050505 calc(50% - 746*var(--u)),transparent calc(50% - 676*var(--u)),transparent calc(50% + 676*var(--u)),#050505 calc(50% + 746*var(--u)))}
.topbar>*,.hero>*,.logos{position:absolute}
.brand{right:calc(75*var(--u));top:calc(27*var(--u));width:calc(31.5*var(--u));height:calc(48.5*var(--u))}
.brand svg{width:100%;height:100%;display:block}
.links{left:50%;top:calc(51*var(--u));transform:translate(-50%,-50%);display:flex;gap:calc(24.5*var(--u));font-size:calc(19*var(--u));color:var(--nav);white-space:nowrap}
.links a:hover{color:#fff}
.pill{display:inline-flex;align-items:center;justify-content:center;background:var(--pill);color:var(--pill-ink);border-radius:999px;font-weight:500}
.pill span{transform:translateY(calc(1*var(--u)))}
.pill-nav{left:calc(75.4*var(--u));top:calc(27*var(--u));width:calc(175*var(--u));height:calc(49*var(--u));font-size:calc(20.6*var(--u))}
.burger{display:none}
.headline{right:calc(75.5*var(--u));top:calc(230.5*var(--u));margin:0;font-family:'Amiri','Tajawal',serif;font-size:calc(71.6*var(--h));line-height:calc(80.5*var(--h));font-weight:400;letter-spacing:0;white-space:nowrap}
.headline span,.sub span{display:block}
.sub{right:calc(75.5*var(--u));top:calc(230.5*var(--u) + 189*var(--h));margin:0;font:400 calc(20.7*var(--h))/calc(30*var(--h)) 'Tajawal',sans-serif;color:var(--muted);white-space:nowrap}
.pill-cta{right:calc(74.9*var(--u));top:calc(230.5*var(--u) + 274*var(--h));width:calc(175.6*var(--h));height:calc(50*var(--h));font-size:calc(20.6*var(--h))}
.ghost{right:calc(74.9*var(--u) + 200*var(--h));top:calc(230.5*var(--u) + 289*var(--h));font-size:calc(20.6*var(--h));font-weight:500;color:#fff}
.logos{width:calc(741*var(--u));left:50%;top:0;height:100%;transform:translateX(-50%);color:var(--strip);pointer-events:none}
.lg{position:absolute;top:calc(998*var(--u));font:700 calc(19*var(--u))/1 'Amiri','Tajawal',serif;white-space:nowrap;pointer-events:auto;display:flex;align-items:center;gap:calc(10*var(--u))}
.lg i{width:calc(9*var(--u));height:calc(9*var(--u));border:1.5px solid currentColor;border-radius:50%;display:block}
.lg:hover{color:#fff}
.lg1{right:0}.lg2{right:calc(190*var(--u))}.lg3{right:calc(390*var(--u))}.lg4{right:calc(560*var(--u))}
.menu{position:absolute;inset:0;z-index:5;background:linear-gradient(rgba(5,5,5,.94),rgba(5,5,5,.98));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;visibility:hidden;transition:opacity .42s,visibility .42s;overflow-y:auto}
.is-open .menu{opacity:1;visibility:visible}
.menu-inner{max-width:720px;margin:0 auto;padding:calc(110*var(--u)) 24px 60px}
.menu-eyebrow{color:var(--muted);font-size:14px;letter-spacing:.2em;margin:0 0 12px}
.menu-list{list-style:none;margin:0;padding:0}
.menu-list li{opacity:0;transform:translateY(14px);transition:.5s cubic-bezier(.22,1,.36,1)}
.is-open .menu-list li{opacity:1;transform:none}
.menu-list a{display:flex;justify-content:space-between;gap:16px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.1);font-family:'Amiri',serif;font-size:clamp(22px,2.2vw,30px);color:var(--ink)}
.menu-list a:hover{color:#fff;padding-inline-start:12px}
.menu-list em{font:400 13px 'Manrope',sans-serif;color:var(--muted);direction:ltr;align-self:center}
.close{position:fixed;top:calc(30*var(--u));left:calc(75*var(--u));z-index:6;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:22px;cursor:pointer;display:none}
.is-open .close{display:block}
@media(prefers-reduced-motion:no-preference){
@keyframes rise{from{opacity:0;transform:translateY(calc(14*var(--u)))}}
@keyframes riseNav{from{opacity:0;transform:translate(-50%,calc(-50% + 14*var(--u)))}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes fade{from{opacity:0}}
.brand,.pill-nav{animation:rise .8s cubic-bezier(.22,1,.36,1) both}
.links{animation:riseNav .8s cubic-bezier(.22,1,.36,1) both}
.headline{animation:rise .9s .06s cubic-bezier(.22,1,.36,1) both}
.sub{animation:rise .9s .14s cubic-bezier(.22,1,.36,1) both}
.pill-cta,.ghost{animation:rise .9s .22s cubic-bezier(.22,1,.36,1) both}
.lg{animation:fade 1.1s .34s ease both}}
@media(max-aspect-ratio:11/10){
:root{--m:min(100vw/430,1.34px);--u:var(--m);--h:var(--m)}
html,body{overflow:auto}
.stage{min-height:100dvh;height:auto;display:flex;flex-direction:column;padding:calc(24*var(--m)) calc(24*var(--m)) calc(32*var(--m))}
.plate{position:fixed}
.plate-video{inset:0;left:0;top:0;width:100%;height:100%;transform:scaleX(-1);object-position:57% center}
.plate::after{background:linear-gradient(to left,rgba(5,5,5,.86),rgba(5,5,5,.66) 42%,rgba(5,5,5,.2) 78%,rgba(5,5,5,.1)),linear-gradient(to bottom,rgba(5,5,5,.72),rgba(5,5,5,.34) 24%,rgba(5,5,5,.34) 56%,rgba(5,5,5,.8) 82%,rgba(5,5,5,.97) 94%,#050505)}
.topbar,.hero,.logos{position:relative;z-index:1}
.topbar{display:flex;justify-content:space-between;align-items:center}
.topbar>*,.hero>*,.logos,.lg{position:static}
.brand{width:calc(31.5*var(--m));height:calc(48.5*var(--m))}
.links,.pill-nav{display:none}
.burger{display:flex;flex-direction:column;gap:6px;justify-content:center;width:46px;height:46px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}
.burger i{display:block;height:2px;background:#fff;border-radius:2px}
.hero{margin-top:auto;padding-top:calc(160*var(--m));display:flex;flex-direction:column;align-items:flex-start;gap:calc(20*var(--m))}
.headline{font-size:calc(52*var(--m));line-height:1.3;white-space:normal}
.sub{font-size:calc(17*var(--m));line-height:1.8;white-space:normal}
.sub span{display:inline}
.pill-cta{width:calc(176*var(--m));height:calc(50*var(--m));font-size:calc(19*var(--m));margin-top:calc(8*var(--m))}
.ghost{font-size:calc(19*var(--m))}
.logos{width:100%;height:auto;left:auto;transform:none;margin-top:calc(48*var(--m));display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lg{font-size:calc(19*var(--m))}
.close{left:24px;top:24px}
.menu-inner{padding-top:100px}
}
@media(min-width:600px) and (max-aspect-ratio:11/10){:root{--m:min(100vw/860,100vh/760,1.25px)}.logos{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="plate">
    <video class="plate-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_112712_da9d53df-6d27-4b12-bdf6-aa9dc2622bdf.mp4" type="video/mp4">
    </video>
  </div>

  <header class="topbar">
    <a class="brand" href="#" aria-label="الرئيسية">
      <svg viewBox="0 0 31.5 48.5" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg1" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="34.1" y2="28.9"><stop offset="0" stop-color="#9e9e9e"/><stop offset=".28" stop-color="#a6a6a6"/><stop offset=".34" stop-color="#a3a3a3"/><stop offset=".4" stop-color="#3a3a3a"/><stop offset=".55" stop-color="#414141"/><stop offset=".6" stop-color="#7a7a7a"/><stop offset=".68" stop-color="#8e8e8e"/><stop offset=".8" stop-color="#a9a9a9"/><stop offset=".95" stop-color="#c4c4c4"/><stop offset="1" stop-color="#ccc"/></linearGradient></defs><path d="M21.5 0 L21.5 19.5 L31.5 19.5 L31.5 29 L10 48.5 L10 28.5 L0.5 28.5 L0.5 18.5 Z" fill="url(#bg1)"/><rect x=".5" y="18.5" width="9" height="10" fill="#fdfdfd"/><rect x="22" y="19.5" width="9.5" height="9.5" fill="#fdfdfd"/></svg>
    </a>
    <nav class="links" aria-label="Primary">
      <a href="#" data-open>قصائده</a>
      <a href="https://www.alsh3r.com/poets/view/3559" target="_blank" rel="noopener">الصفحة الكاملة</a>
      <a href="https://www.alsh3r.com/album/view/265" target="_blank" rel="noopener">الصور</a>
      <a href="https://twitter.com/almalek2010" target="_blank" rel="noopener">تويتر</a>
    </nav>
    <a class="pill pill-nav" href="#" data-open><span>قصائده</span></a>
    <button class="burger" id="burger" aria-label="القائمة" aria-expanded="false"><i></i><i></i></button>
  </header>

  <nav class="menu" id="menu" aria-hidden="true">
    <button class="close" id="close" aria-label="إغلاق">×</button>
    <div class="menu-inner">
      <p class="menu-eyebrow">من قصائده</p>
      <ul class="menu-list" id="poems"></ul>
    </div>
  </nav>

  <main class="hero">
    <h1 class="headline"><span>الشاعر</span> <span>محمد آل وافي</span></h1>
    <p class="sub"><span>أكتب لمجرد الخروج عن النص، إثبات الوجود بالفعل لا بالقول،</span> <span>أحاول تجميل يومي لأعيش حاضري.</span></p>
    <a class="pill pill-cta" href="#" data-open><span>اقرأ قصائده</span></a>
    <a class="ghost" href="https://www.alsh3r.com/poets/view/3559" target="_blank" rel="noopener">الصفحة الكاملة</a>
  </main>

  <div class="logos" id="strip"></div>
</div>

<script>
const P=[[73138,"صبري الكذّاب","29/03/18"],[72864,"عزاء نفسي","27/02/18"],[72763,"تمام ....","14/02/18"],[72547,"هزمني كل حلم اجتحت بابه","15/01/18"],[72469,"ذاك عام وراح","03/01/18"],[72312,"لـ الراحلة","04/12/17"],[72186,"راهنت بك","18/10/17"],[72133,"عن الـ ....","01/10/17"],[71924,"ما بدينا","13/08/17"],[71911,"ساحل الذكرى","10/08/17"],[71884,"تباشير الفرح","30/07/17"],[71863,"يجوز أكذب","26/07/17"],[71816,"الرضى ،،،","12/07/17"],[71765,"ما قبل أحبك","20/06/17"],[71190,"شفتك بخير","31/05/17"]];
const url=id=>`https://www.alsh3r.com/poems/view/${id}`;
document.getElementById('poems').innerHTML=P.map((p,i)=>`<li style="transition-delay:${.06+i*.03}s"><a href="${url(p[0])}" target="_blank" rel="noopener"><span>${p[1]}</span><em>${p[2]}</em></a></li>`).join('');
document.getElementById('strip').innerHTML=P.slice(0,4).map((p,i)=>`<a class="lg lg${i+1}" href="${url(p[0])}" target="_blank" rel="noopener"><i></i>${p[1]}</a>`).join('');
const st=document.getElementById('stage'),bu=document.getElementById('burger'),me=document.getElementById('menu');
function set(o){st.classList.toggle('is-open',o);bu.setAttribute('aria-expanded',o);me.setAttribute('aria-hidden',!o);bu.setAttribute('aria-label',o?'إغلاق':'القائمة')}
bu.onclick=()=>set(!st.classList.contains('is-open'));
document.getElementById('close').onclick=()=>set(false);
document.querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();set(true)});
addEventListener('keydown',e=>e.key==='Escape'&&set(false));
addEventListener('resize',()=>innerWidth/innerHeight>1.1&&false);
</script>
</body>
</html>
